[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai4s-core"
version = "0.1.0"
description = "AI for Science workflow orchestration framework"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Anbus", email = "anbus@ai4s.dev"}
]
keywords = ["ai4s", "science", "workflow", "molecular-dynamics", "dft", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
all = ["openai>=1.0", "anthropic>=0.20"]
dev = ["pytest>=7.0", "pytest-cov", "black", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/anbus/ai4s-core"
Repository = "https://github.com/anbus/ai4s-core"

[project.scripts]
ai4s = "ai4s_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai4s_core"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
