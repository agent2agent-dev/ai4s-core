name: "Feature Request"
description: "Suggest a new feature or improvement"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your ideas!

  - type: input
    id: domain
    attributes:
      label: "Scientific Domain"
      description: "Which domain is this for?"
      placeholder: "Molecular Dynamics / DFT / All"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "What problem are you trying to solve?"
      description: "Describe the pain point"
      placeholder: "I spend 2 hours writing GROMACS input files..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "What would you like to see?"
      description: "Describe your ideal solution"
      placeholder: "A command like 'ai4s plan ...' that generates ..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
      description: "What have you tried?"

  - type: textarea
    id: example
    attributes:
      label: "Example query"
      description: "If this is about workflow generation, what's a natural language query you'd use?"
      placeholder: "Run a 100 ns MD simulation of lysozyme in TIP3P water with AMBER force field"
